  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4. Королівство руське (Галицько-Волинська держава). Монгольська навала — Повний посібник НМТ</title>
    <meta
      name="description"
      content="Повний інтерактивний посібник та тренажер НМТ з історії України: передумови об'єднання, правління Романа Мстиславича, Данила Галицького, монгольська навала, культура та флеш-картки."
    />
    <meta
      property="og:title"
      content="Королівство руське (Галицько-Волинська держава). Монгольська навала"
    />
    <meta
      property="og:description"
      content="Повний посібник для підготовки до НМТ: конспект без скорочень, порівняльні таблиці, пастки НМТ, історичні джерела та 100 флеш-карток."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kr_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#F9F8F5] text-stone-900 antialiased dark:bg-[#0C0E12] dark:text-stone-100">

  </body>
</html>
